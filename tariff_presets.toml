# Named electricity-tariff presets for major Indian discoms.
#
# These are *approximate, illustrative* domestic telescopic schedules rounded
# for forecasting — NOT billing-grade. Always confirm against the discom's
# current published tariff order before relying on them.
#
# `slabs` uses the same "LOW-HIGH:RATE,..." grammar as `predict.py --slab`
# (see tariffs.parse_slabs). `fixed` is a per-period fixed charge (INR) and
# `tax_pct` an energy-charge surcharge (electricity duty + tax).

[bses]
label = "BSES Rajdhani (Delhi)"
slabs = "0-200:3.0,200-400:4.5,400-800:6.5,800-1000000:8.0"
fixed = 0.0
tax_pct = 5.0

