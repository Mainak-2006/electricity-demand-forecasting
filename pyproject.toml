[project]
name = "bijli-predict-ai"
version = "0.1.0"
description = "Electricity demand forecasting for Indian households - GRU/LSTM MVP"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
    "holidays==0.106",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.27",
]
notebook = [
    "jupyter==1.1.1",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
]
ui = [
    "streamlit>=1.37",
]
weather = [
    "httpx>=0.27",
]
stats = [
    "statsmodels>=0.14",
]
validate = [
    "pandera>=0.20",
]

[project.scripts]
bijli = "cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Flat layout: the project is a set of top-level script modules plus the
# `models` package. Listing them explicitly stops setuptools from trying to
# package data/, outputs/ and notebooks/.
[tool.setuptools]
packages = ["models"]
py-modules = [
    "ablation",
    "api",
    "app",
    "baselines",
    "calibration",
    "cli",
    "cv",
    "evaluate",
    "features",
    "generate_data",
    "iawe_ingest",
    "inference",
    "logging_utils",
    "manifest",
    "predict",
    "preprocessing",
    "report",
    "service",
    "tariffs",
    "train",
    "tune",
    "validation",
    "weather",
]

# Resolve PyTorch from the CPU wheel index so `uv.lock` is reproducible on
# any machine and in CI, independent of local CUDA drivers.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `x = Depends(...)` in defaults is intended.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
