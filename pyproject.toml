[project]
name = "bijli-predict-ai"
version = "0.1.0"
description = "Electricity demand forecasting for Indian households - GRU/LSTM MVP"
requires-python = ">=3.11"
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "jupyter==1.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
